name: test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies with Forge
        run: |
          forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-foundry-upgrades OpenZeppelin/openzeppelin-contracts-upgradeable --no-git

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test
        id: test
