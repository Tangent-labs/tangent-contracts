name: test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.1.0

      - name: Install npm dependencies
        run: |
          npm install

      - name: Install dependencies with Forge
        run: |
          forge install

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # Ensure Python is installed

      - name: Install Vyper
        run: |
          pip install vyper==0.3.10
          echo "Vyper version:"
          vyper --version

      - name: Run Forge build
        run: |
          forge --version
          forge clean
          forge build
        id: build
