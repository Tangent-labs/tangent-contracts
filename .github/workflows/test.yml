name: test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies with Forge
        run: |
          forge install

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.8" # Ensure Python is installed

      - name: Install Vyper
        run: |
          pip install vyper==0.3.10
          echo "Vyper version:"
          vyper --version

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test --match-path test/tgUSD/*.t.sol
        id: test
